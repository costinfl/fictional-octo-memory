<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Vault</title>
<link rel="stylesheet" href="style.css">
</head><body><main>
<h1>Vault</h1>
<form id="form">
  <p class="sub">Enter your code to see your files.</p>
  <label for="code">Your code</label><input id="code" type="password" autocomplete="off" required autofocus>
  <button id="go" type="submit">Unlock</button>
</form>
<div id="status" class="status" role="status"></div>
<div id="list" hidden></div>
<div id="msg" class="status" role="status"></div>
<div id="delrow" hidden><label for="token">GitHub token (only needed to delete)</label><input id="token" type="password" autocomplete="off"></div>
</main>
<script src="config.js"></script>
<script src="vault.js"></script>
<script src="vault-page.js"></script>
</body></html>
