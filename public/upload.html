<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Private upload</title>
<link rel="stylesheet" href="/style.css">
</head><body><main>
<h1>Upload a PDF</h1>
<p class="sub">Encrypted in your browser before it leaves. The server never sees your code or the file.</p>
<form id="form">
  <div id="first" class="note" hidden><b>First use:</b> the code you enter now becomes your vault code. Choose it carefully; it can't be recovered.</div>
  <label for="file">PDF file</label><input id="file" type="file" accept="application/pdf,.pdf">
  <label for="code">Your code</label><input id="code" type="password" autocomplete="off" required>
  <div id="confirmRow" hidden><label for="code2">Repeat code</label><input id="code2" type="password" autocomplete="off"></div>
  <button id="go" type="submit">Encrypt &amp; upload</button>
</form>
<div id="status" class="status" role="status"></div>
<div id="result" class="note" hidden>Your file is stored. Get it from your private page: <a id="vlink" href="/vault">/vault</a></div>
</main>
<script src="/vendor/pdf-lib-plus-encrypt.min.js"></script>
<script src="/vault.js"></script>
<script src="/upload.js"></script>
</body></html>
